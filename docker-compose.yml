services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-agent:local
    container_name: hermes-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HERMES_HOME=/opt/data
    ports:
      - "9119:9119"
    volumes:
      - .:/opt/data
      - hermes_logs:/opt/data/logs

volumes:
  hermes_logs:

